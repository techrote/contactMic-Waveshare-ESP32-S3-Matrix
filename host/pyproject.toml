[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "contactmic-host"
dynamic = ["version"]
description = "Custom BLE receiver and 48 kHz host audio bridge for ContactMic"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
ble = ["bleak>=1.1,<4"]
audio = ["sounddevice>=0.5,<1"]
qualification = ["bleak>=1.1,<4", "sounddevice>=0.5,<1", "pyserial>=3.5,<4"]

[project.scripts]
contactmic = "contactmic.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "contactmic.__version__"}

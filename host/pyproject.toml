[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "contactmic-host"
dynamic = ["version"]
description = "Host bridge foundation for the Waveshare ESP32-S3 contact microphone"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
contactmic = "contactmic.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "contactmic.__version__"}

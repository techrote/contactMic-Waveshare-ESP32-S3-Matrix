name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# One PR run per update; pushes to feature branches do not duplicate it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workflow:
    name: Workflow validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate Actions syntax and expressions
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -color

  firmware:
    name: Firmware (ESP-IDF v5.5.5, ESP32-S3)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: espressif/idf:v5.5.5
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Clean ESP32-S3 configure and build
        run: |
          # This file exists in the firmware container, not the lint runner.
          # shellcheck disable=SC1091
          . /opt/esp/idf/export.sh
          idf.py --version
          idf.py -C firmware set-target esp32s3
          idf.py -C firmware build

  firmware-usb:
    name: USB UAC2 and CDC (ESP-IDF v5.5.5, ESP32-S3)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: espressif/idf:v5.5.5
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Clean isolated USB-only build with pinned TinyUSB
        run: |
          # shellcheck disable=SC1091
          . /opt/esp/idf/export.sh
          idf.py -C firmware-usb set-target esp32s3
          idf.py -C firmware-usb build
          if grep -Eq '^CONFIG_(BT_ENABLED|ESP_WIFI_ENABLED)=y$' firmware-usb/sdkconfig; then
            echo 'USB-only qualification must not enable a radio'
            exit 1
          fi

  native:
    name: Native core and toolchain guards
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Configure and build native tests
        run: |
          cmake -S tests/native -B build/native -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/native --parallel 2
      - name: Run native tests
        run: ctest --test-dir build/native --output-on-failure --no-tests=error
      - name: Test toolchain rejection paths without ESP-IDF
        run: python3 -m unittest discover -s tests/tooling -v

      - name: Qualify production C source through installed host decoder and DSP
        run: |
          python3 -m venv build/host-verify
          build/host-verify/bin/python -m pip install --no-cache-dir ./host
          build/host-verify/bin/python -I tests/integration/test_cm006.py --simulator build/native/cm006_simulator

  host:
    name: Host (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install host and optional backend dependencies without persistent caches
        run: python -m pip install --no-cache-dir "./host[ble,audio,usb]"
      - name: Check installed dependency consistency
        run: python -m pip check
      - name: Test installed host package without BLE or audio hardware
        run: python -m unittest discover -s host/tests -v
